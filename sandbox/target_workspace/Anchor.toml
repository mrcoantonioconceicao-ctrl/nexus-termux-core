[toolchain]
anchor_version = "0.29.0"

[features]
resolution = "2"
skip-lint = false

[workspace]
members = [
    "programs/nexus_vault",
    "programs/nexus_staking",
    "programs/nexus_token_vault",
]

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"
